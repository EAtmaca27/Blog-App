<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    {% for post in blog_posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p><em>Written by {{ post.author }}
            <a class="delete-link" href="/delete/{{ post.id  }}"><strong>Delete</strong></a><br>
            <a class="edit-link" href="/update/{{ post.id }}"><strong>Edit</strong></a>
        </em></p>
        <p>{{ post.content }}</p>

    </div>
    {% endfor %}
    <br>
    <h2>Click <a href="/add">HERE</a> to add a blog post.</h2>
</body>
</html>
